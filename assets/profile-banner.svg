<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Rohit Vishwakarma — fire and shadow anime-inspired banner</title>
  <desc id="desc">An original anime-inspired banner blending fiery orange energy, dramatic red accents, and a deep indigo shadow palette.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2=".5">
      <stop offset="0" stop-color="#a93618"/>
      <stop offset=".28" stop-color="#4c234d"/>
      <stop offset=".66" stop-color="#17152f"/>
      <stop offset="1" stop-color="#090d1b"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2=".9" y2="0">
      <stop stop-color="#ff6b28"/>
      <stop offset=".55" stop-color="#ffb64a"/>
      <stop offset="1" stop-color="#ffe8a3"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d3b8ff"/>
      <stop offset="1" stop-color="#8068dc"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop stop-color="#ffe7a1"/>
      <stop offset=".68" stop-color="#ff8a35"/>
      <stop offset="1" stop-color="#e74339"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <circle cx="188" cy="164" r="86" fill="#ff6330" opacity=".15" filter="url(#softGlow)"/>
    <circle cx="188" cy="164" r="57" fill="url(#sun)" opacity=".9"/>
    <circle cx="188" cy="164" r="72" fill="none" stroke="#ffc46c" stroke-width="2" opacity=".66"/>
    <circle cx="1025" cy="124" r="91" fill="#9478ef" opacity=".1" filter="url(#softGlow)"/>
    <circle cx="1025" cy="124" r="62" fill="#c9b7fa" opacity=".88"/>
    <path d="M993 68c37 14 56 48 51 82-4 33-31 58-67 62 34-21 45-53 39-84-5-25-16-44-23-60z" fill="#292347" opacity=".88"/>
    <g fill="none" stroke="url(#fire)" stroke-linecap="round" opacity=".58">
      <path d="M-35 276C90 224 139 217 228 230" stroke-width="4"/>
      <path d="M-16 297C91 252 141 247 213 254" stroke-width="2"/>
      <path d="M945 235c86 20 155 13 287-35" stroke="#aa91ff" stroke-width="3"/>
      <path d="M971 257c78 14 153 2 249-31" stroke="#aa91ff" stroke-width="1.5"/>
    </g>
    <g fill="#fff2d1" opacity=".9">
      <circle cx="316" cy="65" r="2"/><circle cx="390" cy="236" r="1.6"/><circle cx="522" cy="71" r="1.8"/>
      <circle cx="735" cy="49" r="1.8"/><circle cx="816" cy="211" r="1.5"/><circle cx="1110" cy="236" r="2"/>
      <circle cx="907" cy="75" r="1.4"/><circle cx="271" cy="179" r="1.3"/>
    </g>
    <g stroke="#fff1dc" stroke-width="2" opacity=".82">
      <path d="M355 119v16m-8-8h16"/><path d="M858 107v14m-7-7h14"/><path d="M1097 51v16m-8-8h16"/>
    </g>
    <path d="M0 290Q160 257 320 288T650 278T950 287T1200 260V340H0Z" fill="#0b1022" opacity=".74"/>
    <path d="M0 290Q160 257 320 288T650 278T950 287T1200 260" fill="none" stroke="url(#shadow)" stroke-width="2" opacity=".75"/>
    <g font-family="'Trebuchet MS', Arial, sans-serif" text-anchor="middle">
      <text x="610" y="145" fill="#11111e" stroke="#f47a3c" stroke-width="8" stroke-linejoin="round" paint-order="stroke" font-size="47" font-weight="900" letter-spacing="2" filter="url(#titleShadow)">ROHIT VISHWAKARMA</text>
      <text x="610" y="190" fill="url(#shadow)" font-size="18" font-weight="700" letter-spacing="5">FRONTEND · FULL-STACK · SOFTWARE TESTING</text>
      <text x="610" y="226" fill="#f7d9c2" font-size="14" letter-spacing="3">CURIOSITY · CODE · COURAGE</text>
    </g>
  </g>
</svg>
